<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- theme-color tracks the real rail plane (--side), not the old palette. -->
    <meta name="theme-color" content="#15181d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="MARS — Multi-Agent Research System. Decomposes a hard question across a coordinated team of specialist agents, verifies every claim against its source, and writes a cited report live to your console." />
    <!-- Single source of truth: the favicon is the same asset as the in-app
         .planet logo (public/mars.svg). No stale PNG variants. -->
    <link rel="icon" type="image/svg+xml" href="/mars.svg" />
    <link rel="mask-icon" href="/mars.svg" color="#E8794F" />
    <title>MARS — Multi-Agent Research System</title>
    <!-- Resolve the theme BEFORE first paint so there is no flash of the
         wrong palette. Mirrors src/theme.js: stored preference wins, else OS. -->
    <script>
      (function () {
        try {
          // Same key as src/theme.js (mars-docs-theme) so the boot paint and
          // the React state can never disagree. A stored choice wins; otherwise
          // fall back to the OS preference instead of hardcoding dark.
          var stored = localStorage.getItem("mars-docs-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
