<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Same Mars logo as the in-app .planet (.planet CSS in components.css):
       radial-gradient sphere with its craters + highlight, on the app's
       #0b0b0d rounded tile. Kept as one flat SVG so the favicon asset is
       identical to the rendered logo. -->
  <defs>
    <radialGradient id="marsSphere" cx="0.35" cy="0.30" r="0.78">
      <stop offset="0" stop-color="#f0a276"/>
      <stop offset="0.22" stop-color="#E8794F"/>
      <stop offset="0.45" stop-color="#c05a35"/>
      <stop offset="0.66" stop-color="#8f3f27"/>
      <stop offset="0.85" stop-color="#5c291b"/>
      <stop offset="1" stop-color="#3a1911"/>
    </radialGradient>
    <radialGradient id="marsHi" cx="0.30" cy="0.24" r="0.46">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="marsShade" cx="0.70" cy="0.74" r="0.75">
      <stop offset="0.4" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>
    <clipPath id="marsClip"><circle cx="32" cy="34" r="20"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b0b0d"/>
  <circle cx="32" cy="34" r="20" fill="url(#marsSphere)"/>
  <g clip-path="url(#marsClip)">
    <ellipse cx="41" cy="27" rx="4.2" ry="3" fill="#461408" opacity="0.55"/>
    <ellipse cx="40" cy="47" rx="5" ry="3.4" fill="#461408" opacity="0.5"/>
    <ellipse cx="46" cy="41" rx="2.7" ry="2.1" fill="#461408" opacity="0.45"/>
    <ellipse cx="39" cy="28" rx="6" ry="4.8" fill="#ffc49c" opacity="0.22"/>
  </g>
  <circle cx="32" cy="34" r="20" fill="url(#marsShade)"/>
  <circle cx="32" cy="34" r="20" fill="url(#marsHi)"/>
</svg>
